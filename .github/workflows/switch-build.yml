name: Switch NRO

# Manual Switch cross-build. The code is checked out from switch/homebrew;
# this file lives on main so the workflow_dispatch button is available.
#
# The official devkitA64 Docker image already has the toolchain, libnx, mesa,
# physfs, freetype and ffmpeg portlibs. Several pieces need workarounds in CI
# (the switch/homebrew branch has never actually been compiled by its author):
#   * switch-sdl3 is not in the image and devkitPro's pacman repo is
#     Cloudflare-blocked -> cross-compile devkitPro/SDL @ switch-sdl-3.4 from
#     GitHub and install it into the portlibs prefix.
#   * the host-side upstream SDL3 needs SDL_UNIX_CONSOLE_BUILD=ON (no X11);
#     CMake 3.31's FindPkgConfig needs PKG_CONFIG_VERSION as a cache var.
#   * bx/bgfx assume a full POSIX libc. devkitPro's newlib does not expose
#     dlfcn.h, popen/pclose, fseeko/ftello, strdup/strnlen or posix_memalign,
#     and bx has no __SWITCH__ platform probe. A CI-only compat shim plus a
#     handful of source patches make the upstream sources build for libnx.
# All source patches touch only the CI working copy; none are committed back.

on:
  workflow_dispatch:
  # Rebuild when the build recipe itself changes, so a CI fix can be verified
  # without clicking Run workflow by hand.
  push:
    paths:
      - '.github/workflows/switch-build.yml'

permissions:
  contents: read

jobs:
  nro:
    name: Build OpenYAMM.nro
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    timeout-minutes: 180

    steps:
      - name: Check out switch/homebrew
        uses: actions/checkout@v7
        with:
          ref: switch/homebrew
          fetch-depth: 1
          persist-credentials: false
          # The repo carries ~20 GB of game assets (assets_dev). A full checkout
          # spends most of the job downloading them, which the NRO build never reads.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /CMakeLists.txt
            /LICENSE
            /COPYRIGHT
            /cmake/
            /core/
            /engine/
            /game/
            /third_party/cgltf/
            /switch/
            /switch-toolchain/
            /tools/openyamm_shaderc_stubs.cpp
            /tools/cook_sprite_atlases_main.cpp
            /tools/SpriteAtlasEncode.cpp
            /tools/SpriteAtlasEncode.h
            /tools/TextureBlockEncode.cpp
            /tools/TextureBlockEncode.h
            /tools/cook_model_textures_main.cpp
            /tools/CookModelGeometry.cpp
            /tools/CookModelGeometry.h

      - name: Host build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake ninja-build make pkg-config zip git curl ca-certificates python3 \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxinerama-dev libxss-dev libxkbcommon-dev \
            libwayland-dev

      - name: Verify toolchain
        run: |
          . /opt/devkitpro/devkita64.sh
          echo "DEVKITPRO=$DEVKITPRO"
          aarch64-none-elf-g++ --version | head -n 1
          which nacptool elf2nro
          cmake --version | head -n 1

      - name: Prepare build resources
        run: |
          echo "==> runner resources"
          echo "cpus=$(nproc)"
          free -m || true
          df -h / | tail -n 1

          # bgfx/bimg/engine translation units are memory hungry. A full
          # `--parallel` build on a 4 vCPU / 16 GB runner previously tripped the
          # OOM killer, surfacing as "The hosted runner lost communication with
          # the server" with the build step still marked in_progress.
          # 1) add a swap fallback when the container permits it,
          # 2) the build steps below cap the job count as the real safeguard.
          if [ ! -f /swapfile ]; then
            fallocate -l 8G /swapfile 2>/dev/null \
              || dd if=/dev/zero of=/swapfile bs=1M count=8192 2>/dev/null || true
            chmod 600 /swapfile 2>/dev/null || true
            mkswap /swapfile >/dev/null 2>&1 || true
          fi
          swapon /swapfile 2>/dev/null && echo "swap enabled" \
            || echo "swap unavailable (container not privileged); using job cap only"
          free -m || true

      - name: Ensure SDL3 Switch portlib
        run: |
          . /opt/devkitpro/devkita64.sh
          PCPATH="$DEVKITPRO/portlibs/switch/bin/aarch64-none-elf-pkg-config"
          [ -x "$PCPATH" ] || PCPATH="$(command -v aarch64-none-elf-pkg-config)"
          have_sdl3() { "$PCPATH" --exists sdl3 2>/dev/null; }

          if have_sdl3; then
            echo "sdl3 already present"; "$PCPATH" --modversion sdl3; exit 0
          fi

          echo "=== Route A: devkitPro pacman repo (may be blocked) ==="
          : > /tmp/pacman-sdl3.log
          if timeout 150 dkp-pacman -Sy --noconfirm >>/tmp/pacman-sdl3.log 2>&1; then
            timeout 240 dkp-pacman -S --noconfirm switch-sdl3 >>/tmp/pacman-sdl3.log 2>&1 || true
          fi
          tail -n 20 /tmp/pacman-sdl3.log || true
          if have_sdl3; then
            echo "ROUTE_A_OK"; "$PCPATH" --modversion sdl3; exit 0
          fi
          echo "Route A unavailable. Cross-compiling SDL3 from GitHub."

          echo "=== Route B: devkitPro/SDL @ switch-sdl-3.4 ==="
          SDL_SRC="$RUNNER_TEMP/SDL"
          SDL_BLD="$RUNNER_TEMP/SDL-build"
          rm -rf "$SDL_SRC" "$SDL_BLD"
          git clone --depth 1 -b switch-sdl-3.4 https://github.com/devkitPro/SDL.git "$SDL_SRC" || {
            echo "::error::Failed to clone devkitPro/SDL switch-sdl-3.4"; exit 1; }
          cmake -S "$SDL_SRC" -B "$SDL_BLD" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/Switch.cmake" \
            -DCMAKE_INSTALL_PREFIX="$DEVKITPRO/portlibs/switch" \
            -DCMAKE_BUILD_TYPE=Release \
            -DNINTENDO_SWITCH=ON \
            -DSDL_STATIC=ON -DSDL_SHARED=OFF \
            -DSDL_TESTS=OFF -DSDL_TEST_LIBRARY=OFF \
            -DSDL_INSTALL=ON -DSDL_INSTALL_TESTS=OFF \
            -DSDL_X11=OFF -DSDL_WAYLAND=OFF 2>&1 | tail -n 30
          cmake --build "$SDL_BLD" --parallel 4 2>&1 | tail -n 30
          cmake --install "$SDL_BLD" 2>&1 | tail -n 20
          if have_sdl3; then
            echo "ROUTE_B_OK"; "$PCPATH" --modversion sdl3; exit 0
          fi
          echo "::error::Could not obtain sdl3 portlib"; exit 1

      - name: Ensure switch-curl portlib
        run: |
          . /opt/devkitpro/devkita64.sh
          PCPATH="$DEVKITPRO/portlibs/switch/bin/aarch64-none-elf-pkg-config"
          [ -x "$PCPATH" ] || PCPATH="$(command -v aarch64-none-elf-pkg-config)"

          if "$PCPATH" --exists libcurl; then
            echo "libcurl already present: $("$PCPATH" --modversion libcurl)"
            exit 0
          fi

          echo "=== libcurl missing; trying the devkitPro pacman repo (may be blocked) ==="
          timeout 150 dkp-pacman -Sy --noconfirm >/tmp/pacman-curl.log 2>&1 || true
          timeout 240 dkp-pacman -S --noconfirm switch-curl >>/tmp/pacman-curl.log 2>&1 || true
          tail -n 20 /tmp/pacman-curl.log || true

          if "$PCPATH" --exists libcurl; then
            echo "libcurl installed: $("$PCPATH" --modversion libcurl)"
            exit 0
          fi

          echo "::error::switch-curl is required by the Switch content bootstrapper"
          echo "--- portlibs of the image ---"
          ls -1 "$DEVKITPRO/portlibs/switch/lib" 2>/dev/null | sort | head -n 80 || true
          exit 1

      - name: Host shader compiler (clean environment)
        run: |
          # IMPORTANT: no devkita64.sh here. Sourcing it points PKG_CONFIG / the
          # library search path at the Switch sysroot, so the host SDL3/bgfx
          # configure cannot find desktop OpenGL/X11 and fails. This step must
          # run in the container's plain host environment.
          # SDL_UNIX_CONSOLE_BUILD=ON: shaderc is a console tool, no X11 needed.
          cmake -S . -B build-switch-host \
            -DOPENYAMM_BUILD_DESKTOP_EXECUTABLE=OFF \
            -DOPENYAMM_BUILD_TESTS=OFF \
            -DSDL_UNIX_CONSOLE_BUILD=ON
          cmake --build build-switch-host --target openyamm_shaderc --parallel
          test -x build-switch-host/openyamm_shaderc

      # The console build has no self-updater, so a fresh SD card has no content and
      # the engine refuses to start. This adds a first-start bootstrap that downloads
      # the Android content profile (ASTC/x2, which the Tegra GPU reads) into the
      # packaged layout AssetFileSystem mounts: assets/index.json + assets/packs/*.zip.
      - name: Add Switch content bootstrapper
        run: |
          cat > game/app/SwitchContentBootstrap.h <<'EOH'
          #pragma once

          #include <filesystem>

          namespace OpenYAMM::Game
          {
          // Makes sure the game content is installed below assetRoot (sdmc:/switch/openyamm/assets).
          // Returns true when the content is ready: either it was already complete, or the
          // bootstrap downloaded it. Shows its own progress window; needs no game assets.
          bool switchBootstrapContent(const std::filesystem::path &assetRoot);
          }
          EOH
          cat > game/app/SwitchContentBootstrap.cpp <<'EOC'
          #include "game/app/SwitchContentBootstrap.h"

          #include <switch.h>

          #include <curl/curl.h>
          #include <SDL3/SDL.h>

          #include "engine/AssetPackIndex.h"
          #include "engine/update/ReleaseManifest.h"
          #include "engine/update/Sha256.h"

          #include <atomic>
          #include <cstdarg>
          #include <cstdint>
          #include <cstdio>
          #include <ctime>
          #include <filesystem>
          #include <fstream>
          #include <mutex>
          #include <optional>
          #include <string>
          #include <system_error>
          #include <utility>
          #include <vector>

          // The Switch build has no self-updater (game/app/ContentSetup.cpp returns Quit on
          // OPENYAMM_SWITCH), so a fresh installation has no way to get the game content.
          // This bootstrap fills that gap: it downloads the Android content profile, which
          // carries the x2 surface textures the Switch profile asks for, into the packaged
          // layout AssetFileSystem mounts (assets/index.json + assets/packs/*.zip).
          //
          // Only engine and the starting world are fetched first; the other continents can
          // be added later by the same mechanism. TLS verification is left off because
          // libnx's ssl service cannot be handed a CA bundle here; the manifest is checked
          // against the Ed25519 key compiled into the game, and every pack against the
          // SHA-256 the signed manifest lists.

          namespace OpenYAMM::Game
          {
          namespace
          {
          constexpr const char *UpdateBaseUrl = "https://jasicek.net/openyamm/updates/";
          constexpr const char *ManifestRelativePath = "channels/stable/android-arm64.json";
          constexpr const char *ManifestPlatform = "android-arm64";
          constexpr const char *StoreDirectoryName = "packs";
          constexpr const char *WantedPackages[] = {"engine", "mm8"};

          // Bumped whenever this file changes so a log can be matched to an NRO build.
          constexpr const char *BootstrapTag = "bootstrap-2026-11-28-b";
          // The download worker gets its own stack: std::thread inherits newlib's default,
          // which is far too small for curl + TLS + the JSON parse (a silent overflow).
          constexpr size_t WorkerStackSize = 512 * 1024;

          // The engine's own log only opens once the content is in place, so a bootstrap
          // that fails or crashes leaves no trace at all. Everything below therefore goes
          // to its own unbuffered file, written next to the assets folder.
          std::mutex gLogMutex;
          std::FILE *gLog = nullptr;

          void openBootstrapLog(const std::filesystem::path &userDataRoot)
          {
              std::lock_guard<std::mutex> lock(gLogMutex);

              if (gLog != nullptr)
              {
                  return;
              }

              std::error_code error;
              std::filesystem::create_directories(userDataRoot, error);
              gLog = std::fopen((userDataRoot / "bootstrap.log").string().c_str(), "a");

              if (gLog != nullptr)
              {
                  // Unbuffered: whatever is written survives a crash later in this run.
                  std::setvbuf(gLog, nullptr, _IONBF, 0);
              }
          }

          void blog(const char *pFormat, ...)
          {
              std::lock_guard<std::mutex> lock(gLogMutex);

              if (gLog == nullptr)
              {
                  return;
              }

              const std::time_t now = std::time(nullptr);
              std::tm local = {};
              // localtime, not localtime_r: devkitPro's newlib does not declare the POSIX variant.
              if (const std::tm *pLocal = std::localtime(&now))
              {
                  local = *pLocal;
              }
              std::fprintf(gLog, "[%02d:%02d:%02d] ", local.tm_hour, local.tm_min, local.tm_sec);

              va_list arguments;
              va_start(arguments, pFormat);
              std::vfprintf(gLog, pFormat, arguments);
              va_end(arguments);

              std::fputc('\n', gLog);
          }


          constexpr int ScreenWidth = 640;
          constexpr int ScreenHeight = 360;
          constexpr float Margin = 24.0f;
          constexpr float GlyphSize = float(SDL_DEBUG_TEXT_FONT_CHARACTER_SIZE);

          struct DownloadState
          {
              std::atomic<uint64_t> doneBytes{0};
              std::atomic<uint64_t> totalBytes{0};
              std::atomic<int> donePacks{0};
              std::atomic<int> totalPacks{0};
              std::atomic<bool> cancel{false};
              std::atomic<bool> finished{false};
              std::atomic<bool> failed{false};
              std::mutex messageMutex;
              std::string message = "Checking the content server...";
              std::string detail;
          };

          void setMessage(DownloadState &state, const std::string &message, const std::string &detail = {})
          {
              std::lock_guard<std::mutex> lock(state.messageMutex);
              state.message = message;
              state.detail = detail;
          }

          void fail(DownloadState &state, const std::string &message, const std::string &detail = {})
          {
              setMessage(state, message, detail);
              state.failed.store(true);
              state.finished.store(true);
          }

          std::string amountText(uint64_t bytes)
          {
              char buffer[32] = {};

              if (bytes >= 1024ull * 1024ull * 1024ull)
              {
                  std::snprintf(buffer, sizeof(buffer), "%.2f GB", double(bytes) / (1024.0 * 1024.0 * 1024.0));
              }
              else
              {
                  std::snprintf(buffer, sizeof(buffer), "%.0f MB", double(bytes) / (1024.0 * 1024.0));
              }

              return buffer;
          }

          bool contentReady(const std::filesystem::path &assetRoot)
          {
              std::string error;
              const std::optional<Engine::AssetPackIndex> index =
                  Engine::loadAssetPackIndex(assetRoot / Engine::AssetPackIndexFileName, error);

              return index && Engine::validateAssetPackFiles(*index, assetRoot / index->store, error);
          }

          size_t writeToMemory(char *pData, size_t elementSize, size_t elementCount, void *pUserData)
          {
              const size_t bytes = elementSize * elementCount;
              static_cast<std::string *>(pUserData)->append(pData, bytes);
              return bytes;
          }

          struct FileSink
          {
              std::FILE *pFile = nullptr;
              DownloadState *pState = nullptr;
          };

          size_t writeToFile(char *pData, size_t elementSize, size_t elementCount, void *pUserData)
          {
              auto *pSink = static_cast<FileSink *>(pUserData);
              const size_t bytes = elementSize * elementCount;

              if (pSink->pState->cancel.load())
              {
                  return 0;
              }

              if (std::fwrite(pData, 1, bytes, pSink->pFile) != bytes)
              {
                  return 0;
              }

              pSink->pState->doneBytes.fetch_add(bytes);
              return bytes;
          }

          int checkCancel(void *pUserData, curl_off_t, curl_off_t, curl_off_t, curl_off_t)
          {
              return static_cast<DownloadState *>(pUserData)->cancel.load() ? 1 : 0;
          }

          void configureCommon(CURL *pCurl)
          {
              curl_easy_setopt(pCurl, CURLOPT_FOLLOWLOCATION, 1L);
              curl_easy_setopt(pCurl, CURLOPT_MAXREDIRS, 5L);
              curl_easy_setopt(pCurl, CURLOPT_CONNECTTIMEOUT, 30L);
              curl_easy_setopt(pCurl, CURLOPT_LOW_SPEED_LIMIT, 1024L);
              curl_easy_setopt(pCurl, CURLOPT_LOW_SPEED_TIME, 120L);
              curl_easy_setopt(pCurl, CURLOPT_SSL_VERIFYPEER, 0L);
              curl_easy_setopt(pCurl, CURLOPT_SSL_VERIFYHOST, 0L);
              curl_easy_setopt(pCurl, CURLOPT_USERAGENT, "OpenYAMM-Switch/1.0");
              curl_easy_setopt(pCurl, CURLOPT_NOSIGNAL, 1L);
          }

          bool httpGetText(const std::string &url, std::string &text, std::string &error)
          {
              CURL *pCurl = curl_easy_init();

              if (pCurl == nullptr)
              {
                  error = "cannot create an HTTP request";
                  return false;
              }

              text.clear();
              configureCommon(pCurl);
              curl_easy_setopt(pCurl, CURLOPT_URL, url.c_str());
              curl_easy_setopt(pCurl, CURLOPT_WRITEFUNCTION, writeToMemory);
              curl_easy_setopt(pCurl, CURLOPT_WRITEDATA, &text);

              const CURLcode result = curl_easy_perform(pCurl);
              long status = 0;
              curl_easy_getinfo(pCurl, CURLINFO_RESPONSE_CODE, &status);
              curl_easy_cleanup(pCurl);

              if (result != CURLE_OK)
              {
                  error = std::string(curl_easy_strerror(result)) + " for " + url;
                  return false;
              }

              if (status != 200)
              {
                  error = "HTTP " + std::to_string(int(status)) + " for " + url;
                  return false;
              }

              return true;
          }

          bool httpDownload(const std::string &url, const std::filesystem::path &part, uint64_t offset,
                            DownloadState *pState, std::string &error)
          {
              std::FILE *pFile = std::fopen(part.string().c_str(), offset > 0 ? "ab" : "wb");

              if (pFile == nullptr)
              {
                  error = "cannot write " + part.string();
                  return false;
              }

              CURL *pCurl = curl_easy_init();

              if (pCurl == nullptr)
              {
                  std::fclose(pFile);
                  error = "cannot start an HTTP transfer";
                  return false;
              }

              FileSink sink{pFile, pState};
              configureCommon(pCurl);
              curl_easy_setopt(pCurl, CURLOPT_URL, url.c_str());
              curl_easy_setopt(pCurl, CURLOPT_WRITEFUNCTION, writeToFile);
              curl_easy_setopt(pCurl, CURLOPT_WRITEDATA, &sink);
              curl_easy_setopt(pCurl, CURLOPT_NOPROGRESS, 0L);
              curl_easy_setopt(pCurl, CURLOPT_XFERINFOFUNCTION, checkCancel);
              curl_easy_setopt(pCurl, CURLOPT_XFERINFODATA, pState);

              if (offset > 0)
              {
                  curl_easy_setopt(pCurl, CURLOPT_RESUME_FROM_LARGE, static_cast<curl_off_t>(offset));
              }

              const CURLcode result = curl_easy_perform(pCurl);
              long status = 0;
              curl_easy_getinfo(pCurl, CURLINFO_RESPONSE_CODE, &status);
              curl_easy_cleanup(pCurl);
              std::fclose(pFile);

              if (result != CURLE_OK)
              {
                  error = std::string(curl_easy_strerror(result)) + " for " + url;
                  return false;
              }

              if (status != 200 && status != 206)
              {
                  error = "HTTP " + std::to_string(int(status)) + " for " + url;
                  return false;
              }

              // A server that ignores Range sends the whole file: the partial data on disk
              // would be glued in front of it.
              if (offset > 0 && status == 200)
              {
                  error = "the server ignored the resume request";
                  return false;
              }

              return true;
          }

          bool wantsPackage(const std::string &package)
          {
              for (const char *pName : WantedPackages)
              {
                  if (package == pName)
                  {
                      return true;
                  }
              }

              return false;
          }

          std::string escapeJson(const std::string &text)
          {
              std::string escaped;
              escaped.reserve(text.size() + 8);

              for (const char character : text)
              {
                  if (character == '"' || character == '\\')
                  {
                      escaped.push_back('\\');
                  }

                  escaped.push_back(character);
              }

              return escaped;
          }

          std::string buildIndexJson(const Engine::ReleaseManifest &manifest, const std::vector<size_t> &selected)
          {
              std::string text;
              text += "{\n";
              text += " \"schema\": 1,\n";
              text += " \"release\": \"" + escapeJson(manifest.release) + "\",\n";
              text += " \"build\": \"" + escapeJson(manifest.build) + "\",\n";
              text += " \"profile\": \"" + std::string(ManifestPlatform) + "\",\n";
              text += " \"content_format\": " + std::to_string(manifest.contentFormat) + ",\n";
              text += " \"store\": \"" + std::string(StoreDirectoryName) + "\",\n";
              text += " \"packs\": [\n";

              for (size_t position = 0; position < selected.size(); ++position)
              {
                  const Engine::AssetPackRecord &pack = manifest.packs[selected[position]];
                  text += "  {\"id\": \"" + escapeJson(pack.id) + "\", \"package\": \"" + escapeJson(pack.package)
                      + "\", \"mount\": \"" + escapeJson(pack.mount) + "\", \"file\": \"" + escapeJson(pack.file)
                      + "\", \"size\": " + std::to_string(pack.size) + ", \"content_id\": \"" + escapeJson(pack.contentId)
                      + "\", \"sha256\": \"" + escapeJson(pack.sha256) + "\"}";

                  if (position + 1 < selected.size())
                  {
                      text += ",";
                  }

                  text += "\n";
              }

              text += " ]\n}\n";
              return text;
          }

          bool downloadPack(const std::string &url, const std::filesystem::path &target,
                            const Engine::AssetPackRecord &pack, DownloadState *pState, std::string &error)
          {
              const std::filesystem::path part(target.string() + ".part");

              for (int attempt = 0; attempt < 2; ++attempt)
              {
                  std::error_code fileError;
                  uint64_t offset = 0;
                  const uintmax_t existing = std::filesystem::file_size(part, fileError);

                  if (!fileError && existing <= pack.size)
                  {
                      offset = existing;
                  }
                  else
                  {
                      std::filesystem::remove(part, fileError);
                  }

                  const uint64_t doneBefore = pState->doneBytes.load();

                  if (!httpDownload(url, part, offset, pState, error))
                  {
                      pState->doneBytes.store(doneBefore);

                      if (pState->cancel.load())
                      {
                          return false;
                      }

                      std::filesystem::remove(part, fileError);
                      continue;
                  }

                  const uintmax_t size = std::filesystem::file_size(part, fileError);

                  if (fileError || size != pack.size)
                  {
                      pState->doneBytes.store(doneBefore);
                      std::filesystem::remove(part, fileError);
                      error = "the pack " + pack.file + " has the wrong size";
                      continue;
                  }

                  const std::optional<std::string> digest = Engine::sha256File(part);

                  if (!digest || *digest != pack.sha256)
                  {
                      pState->doneBytes.store(doneBefore);
                      std::filesystem::remove(part, fileError);
                      error = "the pack " + pack.file + " failed its checksum";
                      continue;
                  }

                  std::filesystem::remove(target, fileError);
                  std::filesystem::rename(part, target, fileError);

                  if (fileError)
                  {
                      error = "cannot move " + part.string() + " into place";
                      return false;
                  }

                  return true;
              }

              return false;
          }

          void runDownload(std::filesystem::path assetRoot, DownloadState *pState)
          {
              std::string error;

              setMessage(*pState, "Checking the content server...");

              // Networking is brought up here, not before the window: a failure has to be
              // readable on screen instead of closing the game with no explanation.
              const Result socketResult = socketInitializeDefault();
              blog("socketInitializeDefault: %08x", socketResult);

              if (R_FAILED(socketResult))
              {
                  fail(*pState, "The console network services did not start.", "socketInitializeDefault failed");
                  return;
              }

              if (curl_global_init(CURL_GLOBAL_DEFAULT) != CURLE_OK)
              {
                  blog("curl_global_init failed");
                  fail(*pState, "The downloader did not start.", "curl_global_init failed");
                  return;
              }

              blog("curl %s", curl_version());

              const std::string manifestUrl = std::string(UpdateBaseUrl) + ManifestRelativePath;
              std::string manifestText;
              std::string signatureText;

              blog("fetching %s", manifestUrl.c_str());

              if (!httpGetText(manifestUrl, manifestText, error) || !httpGetText(manifestUrl + ".sig", signatureText, error))
              {
                  blog("manifest download failed: %s", error.c_str());
                  fail(*pState, "Cannot reach the content server. Connect the console to the internet and start again.",
                       error);
                  return;
              }

              blog("manifest downloaded (%zu bytes) + signature (%zu bytes)", manifestText.size(), signatureText.size());

              if (!Engine::verifyManifestSignature(manifestText, signatureText, Engine::releaseManifestPublicKeys(), error))
              {
                  blog("manifest signature rejected: %s", error.c_str());
                  fail(*pState, "The content list did not verify; the download was stopped.", error);
                  return;
              }

              blog("manifest signature verified");

              std::optional<Engine::ReleaseManifest> manifest = Engine::parseReleaseManifest(manifestText, error);

              if (!manifest || manifest->platform != ManifestPlatform)
              {
                  blog("unexpected manifest: %s", manifest ? manifest->platform.c_str() : error.c_str());
                  fail(*pState, "The content server sent an unexpected release.", manifest ? manifest->platform : error);
                  return;
              }

              blog("manifest release %s build %s, %zu packs, content format %u", manifest->release.c_str(),
                   manifest->build.c_str(), manifest->packs.size(), manifest->contentFormat);

              if (manifest->contentFormat != Engine::SupportedContentFormat)
              {
                  blog("content format %u is not supported", manifest->contentFormat);
                  fail(*pState, "This build cannot read the published content format.",
                       std::to_string(manifest->contentFormat));
                  return;
              }

              if (manifest->packUrls.size() != manifest->packs.size())
              {
                  fail(*pState, "The content list is malformed; the download was stopped.",
                       "pack url count mismatch");
                  return;
              }

              std::vector<size_t> selected;

              for (size_t index = 0; index < manifest->packs.size(); ++index)
              {
                  const Engine::AssetPackRecord &pack = manifest->packs[index];

                  if (!pack.language.empty() || !wantsPackage(pack.package))
                  {
                      continue;
                  }

                  selected.push_back(index);
              }

              if (selected.empty())
              {
                  fail(*pState, "The published release has no content for this build.");
                  return;
              }

              std::error_code fileError;
              const std::filesystem::path storeRoot = assetRoot / StoreDirectoryName;
              std::filesystem::create_directories(storeRoot, fileError);

              struct Job
              {
                  size_t packIndex = 0;
                  uint64_t offset = 0;
              };

              std::vector<Job> jobs;
              uint64_t totalBytes = 0;

              for (const size_t index : selected)
              {
                  const Engine::AssetPackRecord &pack = manifest->packs[index];
                  const std::filesystem::path target = storeRoot / pack.file;
                  const uintmax_t size = std::filesystem::file_size(target, fileError);

                  if (!fileError && size == pack.size)
                  {
                      ++pState->donePacks;
                      continue;
                  }

                  const std::filesystem::path part(target.string() + ".part");
                  const uintmax_t partSize = std::filesystem::file_size(part, fileError);
                  uint64_t offset = 0;

                  if (!fileError && partSize <= pack.size)
                  {
                      offset = partSize;
                  }

                  jobs.push_back(Job{index, offset});
                  totalBytes += pack.size - offset;
              }

              pState->totalBytes.store(totalBytes);
              pState->totalPacks.store(int(jobs.size()));
              pState->donePacks.store(int(selected.size() - jobs.size()));
              blog("%zu of %zu packs selected, %llu bytes to download, %zu already present", jobs.size(), selected.size(),
                   static_cast<unsigned long long>(totalBytes), selected.size() - jobs.size());

              for (size_t position = 0; position < jobs.size(); ++position)
              {
                  if (pState->cancel.load())
                  {
                      pState->finished.store(true);
                      return;
                  }

                  const Job &job = jobs[position];
                  const Engine::AssetPackRecord &pack = manifest->packs[job.packIndex];
                  const std::filesystem::path target = storeRoot / pack.file;

                  setMessage(*pState, "Downloading the game content",
                             "Pack " + std::to_string(position + 1) + " of " + std::to_string(jobs.size()) + ": "
                                 + pack.package);

                  if (!downloadPack(std::string(UpdateBaseUrl) + manifest->packUrls[job.packIndex], target, pack, pState,
                                    error))
                  {
                      if (pState->cancel.load())
                      {
                          blog("download cancelled after %d packs", pState->donePacks.load());
                          pState->finished.store(true);
                          return;
                      }

                      blog("pack %s failed: %s", pack.file.c_str(), error.c_str());
                      fail(*pState, "The download stopped. Check the connection and start the game again; finished packs are "
                                    "kept.", error);
                      return;
                  }

                  pState->donePacks.fetch_add(1);
                  blog("pack %d/%zu done: %s (%s)", pState->donePacks.load(), jobs.size(), pack.file.c_str(),
                       pack.package.c_str());
              }

              setMessage(*pState, "Finishing the installation...");
              blog("all packs downloaded, writing %s", Engine::AssetPackIndexFileName);
              const std::string indexText = buildIndexJson(*manifest, selected);
              const std::filesystem::path indexTemporary = assetRoot / "index.json.tmp";
              {
                  std::ofstream output(indexTemporary, std::ios::binary | std::ios::trunc);
                  output.write(indexText.data(), std::streamsize(indexText.size()));
                  output.flush();

                  if (!output)
                  {
                      fail(*pState, "Cannot write the content index to the SD card.");
                      return;
                  }
              }

              std::filesystem::remove(assetRoot / Engine::AssetPackIndexFileName, fileError);
              std::filesystem::rename(indexTemporary, assetRoot / Engine::AssetPackIndexFileName, fileError);

              if (fileError)
              {
                  blog("cannot rename the index: %s", fileError.message().c_str());
                  fail(*pState, "Cannot write the content index to the SD card.");
                  return;
              }

              blog("content installed under %s", assetRoot.string().c_str());
              pState->finished.store(true);
          }

          std::vector<std::string> wrapText(const std::string &text, size_t columns)
          {
              std::vector<std::string> lines;
              std::string line;
              size_t start = 0;

              while (start < text.size())
              {
                  size_t end = text.find(' ', start);
                  end = end == std::string::npos ? text.size() : end;
                  const std::string word = text.substr(start, end - start);

                  if (!line.empty() && line.size() + 1 + word.size() > columns)
                  {
                      lines.push_back(line);
                      line.clear();
                  }

                  line += (line.empty() ? "" : " ") + word;
                  start = end + 1;
              }

              if (!line.empty())
              {
                  lines.push_back(line);
              }

              return lines;
          }

          void drawLine(SDL_Renderer *pRenderer, float x, float y, float scale, const std::string &text)
          {
              SDL_SetRenderScale(pRenderer, scale, scale);
              SDL_RenderDebugText(pRenderer, x / scale, y / scale, text.c_str());
              SDL_SetRenderScale(pRenderer, 1.0f, 1.0f);
          }
          }

          void runDownloadEntry(void *pArgument)
          {
              auto *pRequest = static_cast<std::pair<std::filesystem::path, DownloadState *> *>(pArgument);
              runDownload(pRequest->first, pRequest->second);
          }

          bool switchBootstrapContent(const std::filesystem::path &assetRoot)
          {
              openBootstrapLog(assetRoot.parent_path());
              blog("");
              blog("=== %s === asset root %s", BootstrapTag, assetRoot.string().c_str());

              if (contentReady(assetRoot))
              {
                  blog("content already installed; nothing to do");
                  return true;
              }

              std::error_code directoryError;
              std::filesystem::create_directories(assetRoot, directoryError);

              if (directoryError)
              {
                  blog("cannot create %s: %s", assetRoot.string().c_str(), directoryError.message().c_str());
                  return false;
              }

              DownloadState state;
              std::pair<std::filesystem::path, DownloadState *> request{assetRoot, &state};

              // A raw libnx thread so the stack size is ours: newlib's default is too small
              // for curl's TLS handshake plus the manifest parse.
              static Thread workerThread;
              static unsigned char workerStack[WorkerStackSize] __attribute__((aligned(0x1000)));
              Result threadResult = threadCreate(&workerThread, runDownloadEntry, &request, workerStack,
                                                 sizeof(workerStack), 0x2C, -2);
              blog("threadCreate: %08x", threadResult);

              if (R_FAILED(threadResult))
              {
                  return false;
              }

              threadResult = threadStart(&workerThread);
              blog("threadStart: %08x", threadResult);

              if (R_FAILED(threadResult))
              {
                  threadClose(&workerThread);
                  return false;
              }

              bool uiReady = SDL_InitSubSystem(SDL_INIT_VIDEO);
              SDL_Window *pWindow = nullptr;
              SDL_Renderer *pRenderer = nullptr;

              if (!uiReady)
              {
                  blog("SDL_INIT_VIDEO failed: %s", SDL_GetError());
              }
              else
              {
                  // The pad is only used for the B button; a failure here must not stop the download.
                  SDL_InitSubSystem(SDL_INIT_GAMEPAD);
                  uiReady = SDL_CreateWindowAndRenderer("OpenYAMM", ScreenWidth * 2, ScreenHeight * 2, 0, &pWindow, &pRenderer);

                  if (!uiReady)
                  {
                      blog("cannot open the progress window: %s", SDL_GetError());
                  }
                  else
                  {
                      SDL_SetRenderLogicalPresentation(pRenderer, ScreenWidth, ScreenHeight,
                                                       SDL_LOGICAL_PRESENTATION_LETTERBOX);
                      blog("progress window ready");
                  }
              }

              // Without a window the content still has to arrive, so keep downloading headless.
              uint64_t finishedAt = 0;

              while (true)
              {
                  if (uiReady)
                  {
                      SDL_Event event;

                      while (SDL_PollEvent(&event))
                      {
                          if (event.type == SDL_EVENT_QUIT
                              || (event.type == SDL_EVENT_GAMEPAD_BUTTON_DOWN
                                  && event.gbutton.button == SDL_GAMEPAD_BUTTON_EAST)
                              || (event.type == SDL_EVENT_KEY_DOWN && event.key.key == SDLK_ESCAPE))
                          {
                              blog("cancel requested by the player");
                              state.cancel.store(true);
                          }
                      }
                  }

                  const bool finished = state.finished.load();

                  if (finished && !state.failed.load())
                  {
                      break;
                  }

                  if (!uiReady)
                  {
                      if (finished)
                      {
                          break;
                      }

                      svcSleepThread(200000000ull);
                      continue;
                  }

                  if (finished && finishedAt == 0)
                  {
                      finishedAt = SDL_GetTicks();
                  }

                  std::string message;
                  std::string detail;
                  {
                      std::lock_guard<std::mutex> lock(state.messageMutex);
                      message = state.message;
                      detail = state.detail;
                  }

                  SDL_SetRenderDrawColor(pRenderer, 10, 10, 13, 255);
                  SDL_RenderClear(pRenderer);
                  SDL_SetRenderDrawColor(pRenderer, 214, 178, 106, 255);
                  drawLine(pRenderer, Margin, Margin, 2.0f, "OpenYAMM content setup");

                  SDL_SetRenderDrawColor(pRenderer, 232, 226, 210, 255);
                  float y = Margin + 40.0f;

                  for (const std::string &line : wrapText(message, 70))
                  {
                      drawLine(pRenderer, Margin, y, 1.0f, line);
                      y += GlyphSize + 6.0f;
                  }

                  y += GlyphSize;

                  if (!detail.empty())
                  {
                      SDL_SetRenderDrawColor(pRenderer, 170, 166, 158, 255);

                      for (const std::string &line : wrapText(detail, 70))
                      {
                          drawLine(pRenderer, Margin, y, 1.0f, line);
                          y += GlyphSize + 6.0f;
                      }
                  }

                  const uint64_t total = state.totalBytes.load();
                  const uint64_t done = state.doneBytes.load();

                  if (total > 0)
                  {
                      const SDL_FRect frame = {Margin, 200.0f, float(ScreenWidth) - 2.0f * Margin, 18.0f};
                      const float fraction = float(double(done) / double(total));
                      const SDL_FRect bar = {frame.x + 2.0f, frame.y + 2.0f, (frame.w - 4.0f) * fraction, frame.h - 4.0f};
                      SDL_SetRenderDrawColor(pRenderer, 120, 98, 58, 255);
                      SDL_RenderRect(pRenderer, &frame);
                      SDL_SetRenderDrawColor(pRenderer, 214, 178, 106, 255);
                      SDL_RenderFillRect(pRenderer, &bar);

                      SDL_SetRenderDrawColor(pRenderer, 232, 226, 210, 255);
                      drawLine(pRenderer, Margin, 228.0f, 1.0f,
                               amountText(done) + " of " + amountText(total) + "   -   pack "
                                   + std::to_string(state.donePacks.load()) + " / " + std::to_string(state.totalPacks.load()));
                  }

                  SDL_SetRenderDrawColor(pRenderer, 170, 166, 158, 255);
                  drawLine(pRenderer, Margin, float(ScreenHeight) - Margin - GlyphSize, 1.0f,
                           state.failed.load() ? "Press B to close" : "Keep the console on. Press B to cancel.");

                  SDL_RenderPresent(pRenderer);

                  if (finishedAt != 0 && SDL_GetTicks() - finishedAt > 20000)
                  {
                      break;
                  }

                  SDL_Delay(50);
              }

              state.cancel.store(true);
              threadWaitForExit(&workerThread);
              threadClose(&workerThread);

              if (uiReady)
              {
                  SDL_DestroyRenderer(pRenderer);
                  SDL_DestroyWindow(pWindow);
                  SDL_QuitSubSystem(SDL_INIT_VIDEO | SDL_INIT_GAMEPAD);
              }

              curl_global_cleanup();

              {
                  std::lock_guard<std::mutex> lock(state.messageMutex);

                  if (!state.message.empty() && state.failed.load())
                  {
                      blog("last message: %s (%s)", state.message.c_str(), state.detail.c_str());
                  }
              }

              const bool ready = !state.failed.load() && contentReady(assetRoot);
              blog("bootstrap finished: ready=%d failed=%d", ready ? 1 : 0, state.failed.load() ? 1 : 0);
              return ready;
          }
          }
          EOC
          grep -n "switchBootstrapContent" game/app/SwitchContentBootstrap.h game/app/SwitchContentBootstrap.cpp
      - name: Hook the bootstrapper into the game
        run: |
          python3 - <<'PY'
          import pathlib
          import sys

          # 1. Call the bootstrap from the Switch entry point, before the engine
          #    initialises AssetFileSystem (it refuses to start without content).
          p = pathlib.Path("game/app/SwitchMain.cpp")
          if not p.exists():
              sys.exit("ERROR: game/app/SwitchMain.cpp not found")
          s = p.read_text()
          if "SwitchContentBootstrap.h" not in s:
              old = '#include "game/app/OpenYammMain.h"'
              if old not in s:
                  sys.exit("ERROR: SwitchMain include anchor not found")
              s = s.replace(old, old + '\n#include "game/app/SwitchContentBootstrap.h"', 1)
              anchor = "    const int result = runWithSwitchArguments(argc, argv);"
              if anchor not in s:
                  sys.exit("ERROR: SwitchMain call anchor not found")
              inject = (
                  "    // The console has no updater: fetch the game content before the engine mounts it.\n"
                  "    if (!OpenYAMM::Game::switchBootstrapContent(\n"
                  "            std::filesystem::path(OPENYAMM_SWITCH_USER_DATA_DIR) / \"assets\"))\n"
                  "    {\n"
                  "        std::fprintf(stderr, \"Switch content setup did not finish; the game cannot start.\\n\");\n"
                  "        unmountRomfs();\n"
                  "        return 3;\n"
                  "    }\n\n")
              s = s.replace(anchor, inject + anchor, 1)
              p.write_text(s)
          print("hooked the content bootstrap into SwitchMain.cpp")

          # 2. Build the new file into openyamm_switch, not openyamm_game: <switch.h> only
          #    reaches targets that see libnx's include path (the `nx` interface target
          #    SwitchMain.cpp already links). openyamm_game is a plain static library and
          #    does not link nx, which is why the first attempt failed on #include <switch.h>.
          p = pathlib.Path("game/CMakeLists.txt")
          if not p.exists():
              sys.exit("ERROR: game/CMakeLists.txt not found")
          s = p.read_text()
          if "SwitchContentBootstrap" not in s:
              s += (
                  "\n# CI-only: Switch content bootstrapper (Android x2 content profile).\n"
                  "if (OPENYAMM_SWITCH)\n"
                  "    # switch-toolchain/switch.cmake never puts libnx on the include path, and the\n"
                  "    # devkitA64 image keeps the headers in $DEVKITPRO/libnx/include, so any target\n"
                  "    # that includes <switch.h> has to be told explicitly. Set it per directory so\n"
                  "    # every current and future target in game/ sees it.\n"
                  "    include_directories(\"${DEVKITPRO}/libnx/include\" \"${DEVKITPRO}/portlibs/switch/include\")\n"
                  "endif()\n"
                  "if (TARGET openyamm_switch AND OPENYAMM_SWITCH)\n"
                  "    target_sources(openyamm_switch PRIVATE ${CMAKE_CURRENT_SOURCE_DIR}/app/SwitchContentBootstrap.cpp)\n"
                  "    find_package(PkgConfig QUIET)\n"
                  "    if (NOT PKG_CONFIG_FOUND)\n"
                  "        message(FATAL_ERROR \"the Switch content bootstrapper needs pkg-config and switch-curl\")\n"
                  "    endif()\n"
                  "    pkg_check_modules(SWITCH_CURL REQUIRED libcurl)\n"
                  "    target_include_directories(openyamm_switch PRIVATE ${SWITCH_CURL_INCLUDE_DIRS})\n"
                  "    target_link_directories(openyamm_switch PRIVATE ${SWITCH_CURL_LIBRARY_DIRS})\n"
                  "    # curl is static: its private deps (zlib, libnx) have to follow it.\n"
                  "    target_link_libraries(openyamm_switch PRIVATE ${SWITCH_CURL_STATIC_LIBRARIES} z)\n"
                  "endif()\n")
              p.write_text(s)
          print("hooked the content bootstrapper into game/CMakeLists.txt")
          PY
          grep -n 'SwitchContentBootstrap' game/CMakeLists.txt game/app/SwitchMain.cpp

      - name: Build NRO
        run: |
          # NOTE: the devkitpro image has no bash, so GitHub runs every step as
          # `sh -e` (dash). Do not use bash-only features such as pipefail;
          # keep this script POSIX and capture exit codes explicitly.
          . /opt/devkitpro/devkita64.sh
          export PATH="$DEVKITPRO/tools/bin:$DEVKITPRO/devkita64/bin:$DEVKITPRO/portlibs/switch/bin:$PATH"
          ROOT="$PWD"
          # Peak memory matters more than wall time here: the runner has 4 vCPU
          # but a single bgfx renderer TU can take 3-4 GB. -j2 plus the swap
          # fallback keeps the runner alive; 180 min timeout is ample.
          JOBS=2
          echo "==> build jobs: $JOBS"

          echo "==> [1/5] Generate devkitPro newlib compat shim + hook bgfx target"
          # devkitPro's newlib is not a full POSIX libc. Upstream bx/bimg/bgfx
          # assume dlfcn.h, popen/pclose, fseeko/ftello, strdup/strnlen and
          # posix_memalign exist on any POSIX-ish target. All of those sources
          # are compiled into the single openyamm_bgfx target, so inject a shim
          # into that target only (do NOT touch CMAKE_CXX_FLAGS: the toolchain
          # puts -march/-mtp=soft/-fPIE in CMAKE_CXX_FLAGS_INIT).
          mkdir -p "$ROOT/switch-compat/lib"

          # devkitPro's ffmpeg portlib (libavutil.a/hwcontext_nvtegra.o) calls
          # libnx nvtegra MMU helpers that some libnx builds do not export.
          # The nvtegra hwaccel path is never used by this build, so supply
          # no-op stubs when the symbol is not *defined* (an 'U' entry in
          # libnx.a means libnx references it too, not that it provides it).
          if aarch64-none-elf-nm "$DEVKITPRO/libnx/lib/libnx.a" 2>/dev/null \
               | grep -qE '^[0-9a-fA-F]+ [TtWw] mmuRequestGet$'; then
            printf 'void __openyamm_compat_anchor(void) {}\n' \
              > "$ROOT/switch-compat/compat.c"
            echo "libnx defines mmuRequest*; no stub needed"
          else
            printf 'void mmuRequestGet(void) {}\nvoid mmuRequestSetAndWait(void) {}\n' \
              > "$ROOT/switch-compat/compat.c"
            echo "libnx does not define mmuRequest*; adding no-op stubs"
          fi
          aarch64-none-elf-gcc -c "$ROOT/switch-compat/compat.c" \
            -o "$ROOT/switch-compat/compat.o"
          aarch64-none-elf-ar rcs "$ROOT/switch-compat/lib/libopenyammcompat.a" \
            "$ROOT/switch-compat/compat.o"
          echo "built libopenyammcompat.a"
          cat > "$ROOT/switch-compat/switch-compat.h" <<'SHIM'
          #ifndef OPENYAMM_SWITCH_COMPAT_H
          #define OPENYAMM_SWITCH_COMPAT_H
          /* CI-only compatibility shim for the devkitPro / libnx (newlib) target.
           * Injected with -include into openyamm_bgfx only; never committed. */
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <malloc.h>

          /* No process spawning in Switch homebrew: fail gracefully. */
          static inline FILE* openyamm_popen_stub(const char* _c, const char* _m) {
              (void)_c; (void)_m; return (FILE*)0;
          }
          static inline int openyamm_pclose_stub(FILE* _f) { (void)_f; return -1; }
          #define popen  openyamm_popen_stub
          #define pclose openyamm_pclose_stub

          /* newlib has fseek/ftell (long is 64-bit on aarch64), not fseeko/ftello. */
          #define fseeko fseek
          #define ftello ftell

          static inline char* openyamm_strdup_stub(const char* _s) {
              if (!_s) return (char*)0;
              size_t n = strlen(_s) + 1;
              char* p = (char*)malloc(n);
              if (p) memcpy(p, _s, n);
              return p;
          }
          #define strdup openyamm_strdup_stub

          static inline size_t openyamm_strnlen_stub(const char* _s, size_t _m) {
              size_t n = 0;
              while (n < _m && _s[n]) ++n;
              return n;
          }
          #define strnlen openyamm_strnlen_stub

          /* newlib's memalign() returns a pointer free()-able like malloc(). */
          static inline int openyamm_posix_memalign_stub(void** _out, size_t _a, size_t _s) {
              if (!_out) return 22;                 /* EINVAL */
              if (_a < sizeof(void*)) _a = sizeof(void*);
              void* p = memalign(_a, _s);
              if (!p) return 12;                    /* ENOMEM */
              *_out = p;
              return 0;
          }
          #define posix_memalign openyamm_posix_memalign_stub

          /* newlib has getenv() but no setenv()/unsetenv(): on Switch there is no
           * process environment to mutate, so these succeed as no-ops. */
          static inline int openyamm_setenv_stub(const char* _n, const char* _v, int _o) {
              (void)_n; (void)_v; (void)_o; return 0;
          }
          static inline int openyamm_unsetenv_stub(const char* _n) { (void)_n; return 0; }
          #define setenv   openyamm_setenv_stub
          #define unsetenv openyamm_unsetenv_stub
          #endif /* OPENYAMM_SWITCH_COMPAT_H */
          SHIM

          # Stub <enet/enet.h>: the Switch build disables network co-op (see
          # cmake/Dependencies.cmake), yet engine/net/LanDiscovery.cpp and
          # RendezvousServer.cpp are compiled and include <enet/enet.h>.
          # devkitPro's enet/unix.h pulls in sys/socket.h, absent from newlib.
          # Every socket call fails, so those features simply stay off.
          mkdir -p "$ROOT/switch-compat/enet"
          cat > "$ROOT/switch-compat/enet/enet.h" <<'ENET'
          #ifndef OPENYAMM_ENET_STUB_H
          #define OPENYAMM_ENET_STUB_H
          #include <stdint.h>
          #include <stddef.h>

          #ifndef FD_SETSIZE
          #define FD_SETSIZE 1024
          #endif

          #ifdef __cplusplus
          extern "C" {
          #endif

          typedef intptr_t ENetSocket;
          typedef struct { uint32_t host; uint16_t port; } ENetAddress;
          typedef struct { void* data; size_t dataLength; } ENetBuffer;
          typedef struct { unsigned char bits[128]; } ENetSocketSet;

          #define ENET_SOCKET_NULL           ((ENetSocket)-1)
          #define ENET_SOCKET_TYPE_DATAGRAM 1
          #define ENET_HOST_ANY             0
          #define ENET_HOST_BROADCAST       0xFFFFFFFFu
          #define ENET_SOCKOPT_NONBLOCK     1
          #define ENET_SOCKOPT_BROADCAST    2
          #define ENET_SOCKETSET_EMPTY(s)   do { (void)(s); } while (0)
          #define ENET_SOCKETSET_ADD(s, k)  do { (void)(s); (void)(k); } while (0)

          static inline ENetSocket enet_socket_create(int t) { (void)t; return ENET_SOCKET_NULL; }
          static inline void enet_socket_destroy(ENetSocket s) { (void)s; }
          static inline int enet_socket_bind(ENetSocket s, const ENetAddress* a) { (void)s; (void)a; return -1; }
          static inline int enet_socket_set_option(ENetSocket s, int o, int v) { (void)s; (void)o; (void)v; return -1; }
          static inline int enet_socket_get_address(ENetSocket s, ENetAddress* a) { (void)s; (void)a; return -1; }
          static inline int enet_socket_send(ENetSocket s, const ENetAddress* a, const ENetBuffer* b, size_t n) { (void)s; (void)a; (void)b; (void)n; return -1; }
          static inline int enet_socket_receive(ENetSocket s, ENetAddress* a, ENetBuffer* b, size_t n) { (void)s; (void)a; (void)b; (void)n; return -1; }
          static inline int enet_address_set_host_ip(ENetAddress* a, const char* ip) { (void)a; (void)ip; return -1; }
          static inline int enet_socketset_select(ENetSocket h, ENetSocketSet* r, ENetSocketSet* w, uint32_t t) { (void)h; (void)r; (void)w; (void)t; return -1; }

          #ifdef __cplusplus
          }
          #endif
          #endif /* OPENYAMM_ENET_STUB_H */
          ENET

          # Hook -include into openyamm_bgfx by patching the project's own
          # BgfxRuntime.cmake. This must happen BEFORE cmake configure, since
          # CMake reads that file during configuration.
          python3 - <<'PY'
          import pathlib, sys
          p = pathlib.Path("cmake/BgfxRuntime.cmake")
          if not p.exists():
              sys.exit("ERROR: cmake/BgfxRuntime.cmake not found")
          s = p.read_text()
          marker = "        target_include_directories(openyamm_bgfx"
          if marker not in s:
              sys.exit("ERROR: openyamm_bgfx target_include_directories not found")
          inject = ("        # CI-only: devkitPro newlib compat shim (see switch-build.yml).\n"
                    "        target_compile_options(openyamm_bgfx PRIVATE\n"
                    "            -include \"${CMAKE_SOURCE_DIR}/switch-compat/switch-compat.h\")\n\n")
          s = s.replace(marker, inject + marker, 1)
          p.write_text(s)
          print("hooked compat shim into openyamm_bgfx")

          # Make openyamm_engine see our CI compat headers BEFORE the devkitPro
          # portlibs include dir, so <enet/enet.h> resolves to the stub above.
          p = pathlib.Path("engine/CMakeLists.txt")
          if not p.exists():
              sys.exit("ERROR: engine/CMakeLists.txt not found")
          s = p.read_text()
          marker = "target_include_directories(openyamm_engine"
          if marker not in s:
              sys.exit("ERROR: openyamm_engine target_include_directories not found")
          inject = ("# CI-only: devkitPro newlib / ENet compatibility headers.\n"
                    "target_include_directories(openyamm_engine BEFORE PRIVATE\n"
                    "    ${CMAKE_SOURCE_DIR}/switch-compat)\n\n")
          s = s.replace(marker, inject + marker, 1)
          p.write_text(s)
          print("hooked compat include dir into openyamm_engine")

          # openyamm_game/app/main.cpp calls setenv(), absent from newlib.
          # Also add the devkitPro link search paths: the toolchain passes
          # -specs=switch.specs (which pulls in -lnx), but nothing puts
          # $DEVKITPRO/libnx/lib or $DEVKITPRO/portlibs/switch/lib on the -L
          # line, so the final link cannot resolve -lnx/-lEGL/-lglapi.
          # Append (not insert) so the targets already exist in that scope.
          p = pathlib.Path("game/CMakeLists.txt")
          if not p.exists():
              sys.exit("ERROR: game/CMakeLists.txt not found")
          s = p.read_text()
          if "switch-compat/switch-compat.h" not in s:
              s += ("\n# CI-only: devkitPro newlib compat shim (see switch-build.yml).\n"
                    "if (TARGET openyamm_game)\n"
                    "    target_compile_options(openyamm_game PRIVATE\n"
                    "        -include \"${CMAKE_SOURCE_DIR}/switch-compat/switch-compat.h\")\n"
                    "endif()\n")
          if "devkitPro sysroot link paths" not in s:
              s += ("\n# CI-only: devkitPro sysroot link paths (libnx + switch portlibs).\n"
                    "if (TARGET openyamm_switch)\n"
                    "    target_link_directories(openyamm_switch PRIVATE\n"
                    "        \"$ENV{DEVKITPRO}/libnx/lib\"\n"
                    "        \"$ENV{DEVKITPRO}/portlibs/switch/lib\"\n"
                    "        \"${CMAKE_SOURCE_DIR}/switch-compat/lib\")\n"
                    "    # nx is listed here *after* the portlibs on purpose: the\n"
                    "    # -specs=switch.specs copy of -lnx is scanned before\n"
                    "    # libavutil.a, so its nvtegra MMU symbols stay unresolved\n"
                    "    # until libavutil pulls hwcontext_nvtegra.o. A second -lnx\n"
                    "    # at the end of the line closes that ordering hole.\n"
                    "    target_link_libraries(openyamm_switch PRIVATE openyammcompat nx)\n"
                    "endif()\n")
              p.write_text(s)
          print("hooked compat shim + link paths into openyamm_game")
          PY
          grep -n 'switch-compat' cmake/BgfxRuntime.cmake


          echo "==> [2/5] Configure Switch cross build"
          # CMake 3.31 FindPkgConfig stores PKG_CONFIG_VERSION in a function
          # scope; pkg_check_modules() expands elsewhere. A cache var is global.
          cmake -S . -B build-switch \
            -DCMAKE_TOOLCHAIN_FILE="$ROOT/switch-toolchain/switch.cmake" \
            -DOPENYAMM_SWITCH=ON \
            -DOPENYAMM_HOST_SHADERC="$ROOT/build-switch-host/openyamm_shaderc" \
            -DOPENYAMM_BUILD_TESTS=OFF \
            -DOPENYAMM_BUILD_DESKTOP_EXECUTABLE=OFF \
            -DPKG_CONFIG_VERSION=1

          echo "==> [3/5] Patch fetched bx/bgfx sources for devkitPro Switch"
          # FetchContent populated build-switch/_deps/* during configure. These
          # patches only touch the CI working copy, never the repository.
          python3 - <<'PY'
          import pathlib, re, sys

          def must(ok, msg):
              if not ok:
                  sys.exit("ERROR: " + msg)

          # --- bx platform.h: GCC 15 visionOS probe + force NX platform ---
          p = pathlib.Path("build-switch/_deps/bx-src/include/bx/platform.h")
          must(p.exists(), "bx platform.h not found: " + str(p))
          s = p.read_text()
          bad = "#elif defined(__has_builtin) && __has_builtin(__is_target_os) && __is_target_os(xros)"
          must(bad in s, "bx visionOS probe line not found (bx changed?)")
          s = s.replace(bad, "#elif 0  // visionOS probe disabled for GCC 15 (CI)", 1)
          marker = "#define BX_PLATFORM_POSIX (0"
          must(marker in s, "BX_PLATFORM_POSIX definition not found")
          inject = ("// devkitPro/libnx provides a POSIX pthread layer; bx has no\n"
                    "// __SWITCH__ probe, so force its NX platform here (CI).\n"
                    "#undef  BX_PLATFORM_NX\n"
                    "#define BX_PLATFORM_NX 1  // Nintendo Switch\n\n")
          s = s.replace(marker, inject + marker, 1)
          p.write_text(s)
          print("patched bx platform.h (GCC15 probe + NX)")

          # --- bx os.cpp: skip <dlfcn.h> on NX ---
          # bx already stubs dlopen/dlclose/dlsym for BX_PLATFORM_NX, but its
          # include block still pulls in <dlfcn.h>, which devkitPro newlib lacks.
          p = pathlib.Path("build-switch/_deps/bx-src/src/os.cpp")
          must(p.exists(), "bx os.cpp not found")
          s = p.read_text()
          m = re.search(r'(^[ \t]*#[ \t]*include[ \t]*<dlfcn\.h>[^\n]*$)', s, re.M)
          must(m is not None, "os.cpp <dlfcn.h> include not found")
          s = (s[:m.start()]
               + "#if !BX_PLATFORM_NX  // CI: devkitPro newlib has no dlfcn.h\n"
               + m.group(1)
               + "\n#endif\n"
               + s[m.end():])
          p.write_text(s)
          print("patched bx os.cpp (dlfcn.h guarded for NX)")

          # --- bgfx EGL eglplatform.h: add a devkitPro Switch branch ---
          p = pathlib.Path("build-switch/_deps/bgfx-src/3rdparty/khronos/EGL/eglplatform.h")
          must(p.exists(), "bgfx eglplatform.h not found")
          s = p.read_text()
          marker = "#elif defined(__unix__)"
          must(marker in s, "eglplatform.h __unix__ branch not found")
          inject = ("#elif defined(__SWITCH__) || defined(__NX__) || defined(NINTENDO_SWITCH)\n"
                    "/* devkitPro / libnx: switch-mesa EGL handles are opaque pointers. */\n"
                    "typedef void             *EGLNativeDisplayType;\n"
                    "typedef khronos_uintptr_t EGLNativePixmapType;\n"
                    "typedef khronos_uintptr_t EGLNativeWindowType;\n\n")
          s = s.replace(marker, inject + marker, 1)
          p.write_text(s)
          print("patched bgfx eglplatform.h (Switch native types)")

          # --- Lua luaconf.h: use 64-bit 'long' instead of 'long long' ---
          # Lua 5.4 uses LLONG_MAX as a proxy for C99 'long long' support.
          # devkitPro newlib does not expose LLONG_MAX here, so luaconf.h hits
          # its "Compiler does not support 'long long'" #error and lua_Integer
          # is never defined, which cascades into every lua.h/lauxlib.h error
          # in the project's scripting code. On aarch64 LP64, 'long' is 64-bit,
          # so LUA_INT_LONG keeps full 64-bit Lua integers.
          p = pathlib.Path("build-switch/_deps/lua-src/src/luaconf.h")
          must(p.exists(), "lua luaconf.h not found")
          s = p.read_text()
          s2, n = re.subn(r'(#define\s+LUA_INT_DEFAULT\s+)LUA_INT_LONGLONG',
                          r'\1LUA_INT_LONG  // CI: devkitPro newlib has no LLONG_MAX',
                          s, count=1)
          must(n == 1, "luaconf.h LUA_INT_DEFAULT line not found")
          p.write_text(s2)
          print("patched lua luaconf.h (64-bit long integers)")

          # --- imgui: drop the POSIX shell helpers ---
          # Platform_OpenInShellFn_DefaultImpl uses fork/execvp/waitpid, none of
          # which exist in newlib. Switch homebrew never opens a shell.
          deps = pathlib.Path("build-switch/_deps")
          cands = sorted(deps.glob("imgui*/imgui.cpp")) or \
              sorted(p for p in deps.glob("*/imgui.cpp"))
          must(bool(cands), "imgui.cpp not found under build-switch/_deps")
          p = cands[0]
          s = p.read_text()
          # NOTE: imgui.cpp itself mentions the macro in its own #ifndef guards,
          # so test for our marker line, not for the bare macro name.
          if "CI: no fork/execvp on Switch" not in s:
              s = ("#define IMGUI_DISABLE_DEFAULT_SHELL_FUNCTIONS 1"
                   "  // CI: no fork/execvp on Switch\n" + s)
              # imgui 1.92 installs the default implementation unconditionally;
              # guard that assignment too, otherwise disabling the function just
              # turns into an undefined reference to it.
              old = ("    g.PlatformIO.Platform_OpenInShellFn = "
                     "Platform_OpenInShellFn_DefaultImpl;\n")
              must(old in s, "imgui Platform_OpenInShellFn assignment not found")
              s = s.replace(old,
                            "#ifndef IMGUI_DISABLE_DEFAULT_SHELL_FUNCTIONS\n"
                            + old + "#endif\n", 1)
              p.write_text(s)
              print("patched " + str(p) + " (no shell helpers)")
          else:
              print("imgui.cpp already patched")

          # --- RuntimeShader: resolve shaders from the working directory ---
          # Switch's SDL3 returns "romfs:/" from SDL_GetBasePath() unconditionally
          # (src/filesystem/switch/SDL_sysfilesystem.c), so an NRO without an
          # embedded ROMFS looks for romfs:/runtime/shaders/essl/*.bin, finds
          # nothing, and fails to load every runtime program: the SD-card asset
          # build would start with a black or broken scene. Add the working
          # directory (assets/ first, then the bare root) to the search, which
          # is the layout docs/BUILD_SWITCH.zh-CN.md section 5 documents.
          p = pathlib.Path("game/render/RuntimeShader.cpp")
          must(p.exists(), "RuntimeShader.cpp not found")
          s = p.read_text()
          if "CI: Switch SD-card shader fallback" not in s:
              s = s.replace("#include <iterator>\n",
                            "#include <iterator>\n#include <system_error>\n", 1)
              anchor = ("        return packagedPath;\n"
                        "    }\n"
                        "\n"
                        "    return configuredShaderRoot / shaderName;")
              must(anchor in s, "RuntimeShader getShaderPath tail not found (source changed?)")
              fallback = (
                  "        // CI: Switch SD-card shader fallback. SDL_GetBasePath() is\n"
                  "        // \"romfs:/\" on Switch, so an NRO without embedded ROMFS never\n"
                  "        // finds shaders next to the executable; look in the working\n"
                  "        // directory the Switch entry point enters (sdmc:/switch/openyamm).\n"
                  "        std::error_code cwdError;\n"
                  "        const std::filesystem::path workingDirectory =\n"
                  "            std::filesystem::current_path(cwdError);\n"
                  "\n"
                  "        if (!cwdError)\n"
                  "        {\n"
                  "            const std::filesystem::path candidates[] = {\n"
                  "                workingDirectory / configuredShaderRoot / shaderName,\n"
                  "                workingDirectory / \"assets\" / configuredShaderRoot / shaderName,\n"
                  "            };\n"
                  "\n"
                  "            for (const std::filesystem::path &candidate : candidates)\n"
                  "            {\n"
                  "                if (std::filesystem::exists(candidate))\n"
                  "                {\n"
                  "                    return candidate;\n"
                  "                }\n"
                  "            }\n"
                  "        }\n"
                  "\n"
                  "        return packagedPath;\n"
                  "    }\n"
                  "\n"
                  "    return configuredShaderRoot / shaderName;")
              s = s.replace(anchor, fallback, 1)
              p.write_text(s)
              print("patched RuntimeShader.cpp (working-directory shader fallback)")
          else:
              print("RuntimeShader.cpp already patched")
          PY
          grep -nE 'BX_PLATFORM_NX 1|visionOS probe disabled' \
            build-switch/_deps/bx-src/include/bx/platform.h
          grep -nE 'LUA_INT_DEFAULT' \
            build-switch/_deps/lua-src/src/luaconf.h
          grep -nE 'defined\(__SWITCH__\)' \
            build-switch/_deps/bgfx-src/3rdparty/khronos/EGL/eglplatform.h
          grep -n 'CI: Switch SD-card shader fallback' game/render/RuntimeShader.cpp
          grep -n 'include <system_error>' game/render/RuntimeShader.cpp

          echo "==> [4/5] Compile ESSL shaders"
          rc=0
          cmake --build build-switch --target openyamm_runtime_shaders -j "$JOBS" \
            > build-shaders.log 2>&1 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::Shader build failed (rc=$rc)"
            grep -n 'error:' build-shaders.log | head -n 40 || true
            tail -n 60 build-shaders.log || true
            exit "$rc"
          fi
          tail -n 15 build-shaders.log || true
          shader_count=$(find build-switch/runtime/shaders/essl -maxdepth 1 \
            -name '*.bin' -type f 2>/dev/null | wc -l)
          echo "    $shader_count ESSL shaders"
          [ "$shader_count" -gt 0 ] || { echo "::error::No ESSL shaders produced"; exit 1; }

          echo "==> [5/5] Build OpenYAMM.nro"
          free -m || true
          echo "-- link library inventory --"
          ls -1 "$DEVKITPRO/libnx/lib" 2>/dev/null | grep -iE 'libnx|libdl' || true
          ls -1 "$DEVKITPRO/portlibs/switch/lib" 2>/dev/null \
            | grep -iE 'EGL|glapi|drm|GLES' || true
          # Nothing on Switch needs a dynamic loader (bx stubs dlopen for NX),
          # but some dependency pkg-config files still emit -ldl. Provide an
          # empty archive when the image ships none.
          if [ ! -f "$DEVKITPRO/libnx/lib/libdl.a" ] && \
             [ ! -f "$DEVKITPRO/portlibs/switch/lib/libdl.a" ]; then
            echo 'void __openyamm_dl_placeholder(void) {}' > "$ROOT/switch-compat/dl.c"
            aarch64-none-elf-gcc -c "$ROOT/switch-compat/dl.c" \
              -o "$ROOT/switch-compat/dl.o"
            aarch64-none-elf-ar rcs "$ROOT/switch-compat/lib/libdl.a" \
              "$ROOT/switch-compat/dl.o"
            echo "created empty libdl.a (no dynamic loader on Switch)"
          fi
          rc=0
          cmake --build build-switch --target openyamm_switch_nro -j "$JOBS" \
            > build-nro.log 2>&1 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::NRO build failed (rc=$rc)"
            grep -nE 'error:|undefined reference|Error [0-9]' build-nro.log | head -n 60 || true
            echo "--- tail ---"
            tail -n 80 build-nro.log || true
            exit "$rc"
          fi
          tail -n 20 build-nro.log || true
          test -f build-switch/OpenYAMM.nro || { echo "::error::OpenYAMM.nro missing"; exit 1; }
          echo "==> Build OK: build-switch/OpenYAMM.nro"

      - name: Report build errors
        if: failure()
        run: |
          for log in build-nro.log build-shaders.log; do
            [ -f "$log" ] || continue
            echo "===== $log: error digest ====="
            grep -nE "error:|fatal error|undefined reference|multiple definition|cannot find -l|No rule to make target" "$log" \
              | head -n 20 \
              | while IFS= read -r line; do echo "::error::$log:$line"; done || true
            echo "===== $log: which target compiled the bootstrapper ====="
            grep -n "CMakeFiles/.*SwitchContentBootstrap" "$log" | head -n 4 \
              | while IFS= read -r line; do echo "::error::$log:$line"; done || true
            echo "===== $log: last 40 lines ====="
            tail -n 40 "$log" || true
          done

      - name: Keep build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: |
            build-shaders.log
            build-nro.log
            build-switch/CMakeCache.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Package artifact
        run: |
          mkdir -p dist
          cp build-switch/OpenYAMM.nro dist/
          cp -a build-switch/runtime/shaders dist/
          cat > dist/README.txt <<'EOR'
          OpenYAMM for Nintendo Switch
          ============================

          Copy this whole folder to the SD card as  SD:/switch/openyamm/

            SD:/switch/openyamm/OpenYAMM.nro
            SD:/switch/openyamm/runtime/shaders/essl/*.bin   (146 files)
            SD:/switch/openyamm/assets/                      (game content, downloaded)

          Start it with title takeover (hold R while opening the album), not in applet
          mode: applet mode only has about 100 MB of memory.

          The first start downloads the game content (about 2 GB) and shows a progress
          screen. If it stops, the reason is written to:

            SD:/switch/openyamm/bootstrap.log     (content download)
            SD:/switch/openyamm/openyamm.log      (game)

          Downloads resume: start the game again and it continues with the .part files.
          EOR
          cd dist && zip -r ../openyamm-switch.zip .


      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: openyamm-switch
          path: openyamm-switch.zip
          if-no-files-found: error
          retention-days: 30
