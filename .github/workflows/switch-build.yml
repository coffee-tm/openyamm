name: Switch NRO

# Manual Switch cross-build. The code is checked out from switch/homebrew;
# this file lives on main so the workflow_dispatch button is available.
# devkitPro's own domains are blocked by Cloudflare from the runner IP, so we
# use the official prebuilt devkitA64 Docker image (toolchain + all portlibs).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nro:
    name: Build OpenYAMM.nro
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    timeout-minutes: 180

    steps:
      - name: Check out switch/homebrew
        uses: actions/checkout@v7
        with:
          ref: switch/homebrew
          fetch-depth: 1
          persist-credentials: false
          # The repo carries ~20 GB of game assets (assets_dev). A full checkout
          # spends most of the job downloading them, which the NRO build never reads.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /CMakeLists.txt
            /LICENSE
            /COPYRIGHT
            /cmake/
            /core/
            /engine/
            /game/
            /third_party/cgltf/
            /switch/
            /switch-toolchain/
            /tools/openyamm_shaderc_stubs.cpp
            /tools/cook_sprite_atlases_main.cpp
            /tools/SpriteAtlasEncode.cpp
            /tools/SpriteAtlasEncode.h
            /tools/TextureBlockEncode.cpp
            /tools/TextureBlockEncode.h
            /tools/cook_model_textures_main.cpp
            /tools/CookModelGeometry.cpp
            /tools/CookModelGeometry.h

      - name: Host build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake ninja-build make pkg-config zip libgl1-mesa-dev libx11-dev libxext-dev

      - name: Verify toolchain
        run: |
          # The image sets DEVKITPRO but leaves devkita64/bin out of PATH until
          # the env script is sourced (same as a local install).
          . /opt/devkitpro/devkita64.sh
          echo "DEVKITPRO=$DEVKITPRO"
          aarch64-none-elf-g++ --version | head -n 1
          which nacptool elf2nro
          for module in sdl3 physfs freetype2 libavformat libavcodec; do
            aarch64-none-elf-pkg-config --exists "$module" || {
              echo "::error::Missing Switch portlib: $module"
              exit 1
            }
          done
          cmake --version | head -n 1

      - name: Build NRO
        run: |
          . /opt/devkitpro/devkita64.sh
          ./switch/validate_switch_build.sh

      - name: Package artifact
        run: |
          mkdir -p dist
          cp build-switch/OpenYAMM.nro dist/
          cp -a build-switch/runtime/shaders dist/
          cd dist && zip -r ../openyamm-switch.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: openyamm-switch
          path: openyamm-switch.zip
          if-no-files-found: error
          retention-days: 30
