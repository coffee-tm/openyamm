name: Switch NRO

# Manual Switch cross-build. The code is checked out from switch/homebrew;
# this file lives on main so the workflow_dispatch button is available.
#
# The official devkitA64 Docker image already has the toolchain, libnx, mesa,
# physfs, freetype and ffmpeg portlibs. The only missing piece is switch-sdl3
# (devkitPro's SDL3 fork with a Switch backend). Getting it is adaptive:
#   Route A: install switch-sdl3 from devkitPro's pacman repo (runner IP may
#            reach it even when a local CN IP is Cloudflare-blocked).
#   Route B: cross-compile devkitPro/SDL @ switch-sdl-3.4 from GitHub and
#            install it into the portlibs prefix (GitHub is always reachable).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nro:
    name: Build OpenYAMM.nro
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    timeout-minutes: 180

    steps:
      - name: Check out switch/homebrew
        uses: actions/checkout@v7
        with:
          ref: switch/homebrew
          fetch-depth: 1
          persist-credentials: false
          # The repo carries ~20 GB of game assets (assets_dev). A full checkout
          # spends most of the job downloading them, which the NRO build never reads.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /CMakeLists.txt
            /LICENSE
            /COPYRIGHT
            /cmake/
            /core/
            /engine/
            /game/
            /third_party/cgltf/
            /switch/
            /switch-toolchain/
            /tools/openyamm_shaderc_stubs.cpp
            /tools/cook_sprite_atlases_main.cpp
            /tools/SpriteAtlasEncode.cpp
            /tools/SpriteAtlasEncode.h
            /tools/TextureBlockEncode.cpp
            /tools/TextureBlockEncode.h
            /tools/cook_model_textures_main.cpp
            /tools/CookModelGeometry.cpp
            /tools/CookModelGeometry.h

      - name: Host build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake ninja-build make pkg-config zip git curl ca-certificates python3 \
            libgl1-mesa-dev libx11-dev libxext-dev

      - name: Verify toolchain
        run: |
          # The image sets DEVKITPRO but leaves devkita64/bin out of PATH until
          # the env script is sourced (same as a local install).
          . /opt/devkitpro/devkita64.sh
          echo "DEVKITPRO=$DEVKITPRO"
          aarch64-none-elf-g++ --version | head -n 1
          which nacptool elf2nro
          cmake --version | head -n 1
          echo "=== available Switch portlibs ==="
          dkp-pacman -Q 2>/dev/null | grep '^switch-' | sort || true

      - name: Ensure SDL3 Switch portlib
        run: |
          . /opt/devkitpro/devkita64.sh
          PCPATH="$DEVKITPRO/portlibs/switch/bin/aarch64-none-elf-pkg-config"
          [ -x "$PCPATH" ] || PCPATH="$(command -v aarch64-none-elf-pkg-config)"

          have_sdl3() { "$PCPATH" --exists sdl3 2>/dev/null; }

          echo "=== devkitPro package-repo reachability on this runner ==="
          for u in \
            "https://pkg.devkitpro.org/" \
            "https://pkg.devkitpro.org/packages/x86_64/dkp-libs.db" \
            "https://apt.devkitpro.org/install-devkitpro-pacman"; do
            code=$(curl -sS -L --max-time 20 -o /dev/null -w "%{http_code}" "$u" 2>/dev/null || echo "000")
            echo "  $code  $u"
          done
          echo "=== Switch.cmake platform hints ==="
          grep -iE 'NINTENDO_SWITCH|__SWITCH__|CMAKE_SYSTEM_NAME|LIBNX|TRY_COMPILE' \
            "$DEVKITPRO/cmake/Switch.cmake" 2>/dev/null | head -20 || echo "  (no Switch.cmake)"

          if have_sdl3; then
            echo "sdl3 already present in the image"
            "$PCPATH" --modversion sdl3
            exit 0
          fi

          echo ""
          echo "=== Route A: install switch-sdl3 from devkitPro pacman repo ==="
          : > /tmp/pacman-sdl3.log
          if timeout 150 dkp-pacman -Sy --noconfirm >>/tmp/pacman-sdl3.log 2>&1; then
            echo "  pacman db sync OK"
            timeout 240 dkp-pacman -S --noconfirm switch-sdl3 >>/tmp/pacman-sdl3.log 2>&1 || true
          else
            echo "  pacman db sync failed/timed out (repo likely blocked)"
          fi
          tail -n 25 /tmp/pacman-sdl3.log || true
          if have_sdl3; then
            echo "ROUTE_A_OK: switch-sdl3 installed via dkp-pacman"
            "$PCPATH" --modversion sdl3
            exit 0
          fi
          echo "  Route A did not yield sdl3. Falling back to source build."

          echo ""
          echo "=== Route B: cross-compile devkitPro/SDL @ switch-sdl-3.4 ==="
          SDL_SRC="$RUNNER_TEMP/SDL"
          SDL_BLD="$RUNNER_TEMP/SDL-build"
          rm -rf "$SDL_SRC" "$SDL_BLD"
          if ! git clone --depth 1 -b switch-sdl-3.4 https://github.com/devkitPro/SDL.git "$SDL_SRC"; then
            echo "::error::Failed to clone devkitPro/SDL switch-sdl-3.4"
            exit 1
          fi
          cmake -S "$SDL_SRC" -B "$SDL_BLD" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/Switch.cmake" \
            -DCMAKE_INSTALL_PREFIX="$DEVKITPRO/portlibs/switch" \
            -DCMAKE_BUILD_TYPE=Release \
            -DNINTENDO_SWITCH=ON \
            -DSDL_STATIC=ON -DSDL_SHARED=OFF \
            -DSDL_TESTS=OFF -DSDL_TEST_LIBRARY=OFF \
            -DSDL_INSTALL=ON -DSDL_INSTALL_TESTS=OFF \
            -DSDL_X11=OFF -DSDL_WAYLAND=OFF 2>&1 | tail -n 40
          cmake --build "$SDL_BLD" --parallel 4 2>&1 | tail -n 40
          cmake --install "$SDL_BLD" 2>&1 | tail -n 30

          echo "=== resulting SDL3 files in portlibs ==="
          find "$DEVKITPRO/portlibs/switch" -iname 'sdl3*' 2>/dev/null | head -20
          if have_sdl3; then
            echo "ROUTE_B_OK: SDL3 built from source"
            "$PCPATH" --modversion sdl3
            exit 0
          fi
          echo "::error::Could not obtain sdl3 portlib by either route"
          exit 1

      - name: Build NRO
        run: |
          . /opt/devkitpro/devkita64.sh
          # validate_switch_build.sh exports its own PATH (incl. portlibs/switch/bin)
          # and checks every required pkg-config module itself. Invoke via bash:
          # sparse-checkout does not preserve the executable bit on the script.
          bash switch/validate_switch_build.sh

      - name: Package artifact
        run: |
          mkdir -p dist
          cp build-switch/OpenYAMM.nro dist/
          cp -a build-switch/runtime/shaders dist/
          cd dist && zip -r ../openyamm-switch.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: openyamm-switch
          path: openyamm-switch.zip
          if-no-files-found: error
          retention-days: 30
